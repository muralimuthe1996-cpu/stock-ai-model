name: Daily Stock AI Prediction

on:
  schedule:
    # दररोज भारतीय वेळेनुसार संध्याकाळी ६:०० वाजता (UTC 12:30) रन होईल
    - cron: '30 12 * * 1-5'
  workflow_dispatch: # तुम्ही स्वतः कधीही बटण दाबून चेक करू शकता

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install libraries
        run: pip install yfinance pandas scikit-learn ta requests

      - name: Run AI Model
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
